{{- if not .Values.existingSecret }}
{{- if not .Values.tokens }}
{{- fail "Set tokens.<instanceKey> or existingSecret so the bridge has bot tokens" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "fluxtoflux.fullname" . }}
  labels:
    {{- include "fluxtoflux.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $token := .Values.tokens }}
  FLUXER_TOKEN_{{ upper $key }}: {{ $token | quote }}
  {{- end }}
{{- end }}
